<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Primera Piedra Podcast | Linktree</title>
  <!-- Google Fonts: Inter + Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #0a0c0f;
      --gold-primary: #c69c4a;
      --gold-light: #d4af6a;
      --gold-dark: #8b6914;
      --text-primary: #f2efe9;
      --text-secondary: #b0a99a;
      --card-glass-bg: rgba(20, 22, 25, 0.45);
      --card-glass-border: rgba(198, 156, 74, 0.25);
      --card-glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(198, 156, 74, 0.15);
      --blur-amount: 20px;
      --transition-smooth: cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    body {
      background: var(--bg-deep);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
      background: radial-gradient(circle at 20% 30%, #1a1f25 0%, #0a0c0f 70%),
                  radial-gradient(circle at 80% 70%, #1f1a14 0%, #0a0c0f 70%);
      background-blend-mode: screen;
    }

    /* ----- BLOBS ANIMADOS (dorados flotantes) ----- */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.15;
      z-index: 0;
      pointer-events: none;
      will-change: transform;
      animation: floatBlob 18s infinite alternate ease-in-out;
    }
    .bg-blob-1 {
      width: 70vw;
      height: 70vw;
      max-width: 800px;
      max-height: 800px;
      background: radial-gradient(circle, rgba(198,156,74,0.5) 0%, rgba(139,105,20,0.2) 70%);
      top: -25%;
      left: -20%;
      animation-duration: 22s;
    }
    .bg-blob-2 {
      width: 60vw;
      height: 60vw;
      max-width: 650px;
      max-height: 650px;
      background: radial-gradient(circle, rgba(212,175,106,0.4) 0%, rgba(198,156,74,0.1) 70%);
      bottom: -20%;
      right: -15%;
      animation-duration: 25s;
      animation-direction: alternate-reverse;
    }
    .bg-blob-3 {
      width: 40vw;
      height: 40vw;
      max-width: 400px;
      max-height: 400px;
      background: radial-gradient(circle, rgba(180,140,60,0.4) 0%, rgba(100,70,20,0.1) 70%);
      top: 60%;
      left: 50%;
      animation-duration: 20s;
    }

    @keyframes floatBlob {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -25px) scale(1.08); }
      66% { transform: translate(-30px, 20px) scale(0.94); }
      100% { transform: translate(15px, 35px) scale(1.02); }
    }

    /* ----- CONTENEDOR PRINCIPAL (glass) ----- */
    .glass-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 580px;
      background: var(--card-glass-bg);
      backdrop-filter: blur(var(--blur-amount));
      -webkit-backdrop-filter: blur(var(--blur-amount));
      border-radius: 3rem;
      border: 1px solid var(--card-glass-border);
      box-shadow: var(--card-glass-shadow);
      padding: 2rem 1.8rem 2rem;
      transition: transform 0.3s ease, box-shadow 0.4s ease;
    }

    /* ----- PROFILE ----- */
    .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1e2126, #0f1114);
      box-shadow: 0 15px 30px rgba(0,0,0,0.6), 0 0 0 2px rgba(198,156,74,0.5);
      margin: 0 auto 1.2rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: transform 0.4s var(--transition-smooth), box-shadow 0.4s ease;
    }
    .profile-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .profile-img:hover {
      transform: scale(1.04);
      box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 3px rgba(198,156,74,0.8);
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      text-align: center;
      margin-bottom: 0.2rem;
    }
    .title-accent {
      color: var(--gold-light);
      font-style: italic;
    }
    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 0.4rem;
    }
    .tagline {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--gold-primary);
      background: rgba(198,156,74,0.12);
      padding: 0.3rem 1.2rem;
      border-radius: 40px;
      margin: 0 auto 1.8rem auto;
      width: fit-content;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(198,156,74,0.25);
    }

    /* ----- GRID DE ENLACES (2 columnas) ----- */
    .links-wrapper {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.9rem;
      margin-bottom: 1.8rem;
    }

    /* Estilo base de cada tarjeta */
    .social-link {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      padding: 0.75rem 1rem;
      background: rgba(28, 30, 34, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(198,156,74, 0.2);
      border-radius: 1.8rem;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
      position: relative;
      overflow: hidden;
    }
    /* Efecto shimmer */
    .social-link::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(198,156,74,0.1), transparent);
      transition: left 0.5s ease;
    }
    .social-link:hover {
      transform: translateY(-3px) scale(1.02);
      background: rgba(40, 42, 48, 0.7);
      border-color: rgba(198,156,74, 0.5);
      box-shadow: 0 14px 24px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(198,156,74,0.3);
    }
    .social-link:hover::after {
      left: 100%;
    }
    .social-link:active {
      transform: scale(0.97);
    }

    /* Icono circular */
    .social-icon {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(198,156,74, 0.15);
      border-radius: 50%;
      flex-shrink: 0;
      transition: all 0.2s ease;
    }
    .social-icon img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      display: block;
    }
    .social-link:hover .social-icon {
      background: rgba(198,156,74, 0.35);
      transform: scale(1.05);
    }
    .social-link:hover .social-icon img {
      filter: drop-shadow(0 0 2px rgba(212,175,106,0.6));
    }

    /* Texto dentro del botón */
    .link-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.25;
      overflow: hidden;
    }
    .link-label {
      font-weight: 600;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .link-handle {
      font-size: 0.7rem;
      color: var(--text-secondary);
      font-weight: 400;
      white-space: nowrap;
    }

    /* Botón de contacto (email) ocupa ambas columnas */
    .contact-link {
      grid-column: span 2;
      justify-content: center;
      background: linear-gradient(115deg, rgba(198,156,74,0.25), rgba(180,130,40,0.15));
      border-color: rgba(198,156,74, 0.6);
      text-align: center;
      gap: 1rem;
    }
    .contact-link .link-text {
      align-items: center;
      text-align: center;
    }
    .contact-link:hover {
      background: linear-gradient(115deg, rgba(198,156,74,0.45), rgba(180,130,40,0.3));
      border-color: rgba(212,175,106, 0.9);
      box-shadow: 0 18px 28px rgba(198,156,74,0.25);
    }

    /* FOOTER */
    .footer {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      opacity: 0.8;
      display: flex;
      justify-content: center;
      gap: 0.6rem;
      align-items: center;
    }
    .footer-dot {
      width: 4px;
      height: 4px;
      background: var(--gold-dark);
      border-radius: 50%;
    }

    /* ----- RESPONSIVE: en móviles pequeños forzar 1 columna para no apretar ----- */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }
      .glass-container {
        padding: 1.5rem 1.2rem;
        max-width: 100%;
      }
      .links-wrapper {
        grid-template-columns: 1fr;
        gap: 0.8rem;
      }
      .contact-link {
        grid-column: span 1;
      }
      .social-link {
        padding: 0.7rem 1rem;
      }
      .link-label {
        font-size: 0.9rem;
        white-space: normal;
      }
      .link-handle {
        font-size: 0.7rem;
        white-space: normal;
      }
      .title {
        font-size: 2rem;
      }
    }

    /* Ajuste extra para pantallas entre 480px y 600px: mantener grid pero reducir padding */
    @media (min-width: 481px) and (max-width: 600px) {
      .glass-container {
        padding: 1.6rem 1.2rem;
      }
      .social-link {
        padding: 0.65rem 0.9rem;
        gap: 0.6rem;
      }
      .link-label {
        font-size: 0.85rem;
        white-space: normal;
      }
      .link-handle {
        font-size: 0.65rem;
      }
      .social-icon {
        width: 36px;
        height: 36px;
      }
      .social-icon img {
        width: 20px;
        height: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>

  <main class="glass-container">
    <!-- Perfil con imagen -->
    <div class="profile-img">
      <img src="assets/profile.png" alt="Primera Piedra Podcast" loading="lazy"
           onerror="this.onerror=null; this.src='assets/profile.webp';">
    </div>

    <h1 class="title">Primera <span class="title-accent">Piedra</span></h1>
    <p class="subtitle">Podcast • Bienes Raíces</p>
    <div class="tagline">La base de las grandes inversiones</div>

    <!-- GRID DE ENLACES (2 COLUMNAS) -->
    <div class="links-wrapper">
      <!-- YouTube -->
      <a href="https://www.youtube.com/channel/UCBdGfXLFCowfx5l5XD8y6OQ" target="_blank" rel="noopener noreferrer" class="social-link">
        <span class="social-icon"><img src="assets/youtube-icon.png" alt="YouTube" loading="lazy" onerror="this.src='assets/youtube-icon.webp'"></span>
        <span class="link-text"><span class="link-label">YouTube</span><span class="link-handle">Episodios</span></span>
      </a>
      <!-- Spotify -->
      <a href="https://creators.spotify.com/pod/profile/primera-piedra-podcast/" target="_blank" rel="noopener noreferrer" class="social-link">
        <span class="social-icon"><img src="assets/spotify-icon.png" alt="Spotify" loading="lazy" onerror="this.src='assets/spotify-icon.webp'"></span>
        <span class="link-text"><span class="link-label">Spotify</span><span class="link-handle">Escúchanos</span></span>
      </a>
      <!-- Instagram -->
      <a href="https://www.instagram.com/primerapiedra.ec/" target="_blank" rel="noopener noreferrer" class="social-link">
        <span class="social-icon"><img src="assets/instagram-icon.png" alt="Instagram" loading="lazy" onerror="this.src='assets/instagram-icon.webp'"></span>
        <span class="link-text"><span class="link-label">Instagram</span><span class="link-handle">@primerapiedra.ec</span></span>
      </a>
      <!-- TikTok -->
      <a href="https://www.tiktok.com/@primerapiedra.ec" target="_blank" rel="noopener noreferrer" class="social-link">
        <span class="social-icon"><img src="assets/tiktok-icon.png" alt="TikTok" loading="lazy" onerror="this.src='assets/tiktok-icon.webp'"></span>
        <span class="link-text"><span class="link-label">TikTok</span><span class="link-handle">@primerapiedra.ec</span></span>
      </a>
      <!-- Facebook -->
      <a href="https://www.facebook.com/people/Primera-Piedra-Podcast/61589993567919/" target="_blank" rel="noopener noreferrer" class="social-link">
        <span class="social-icon"><img src="assets/facebook-icon.png" alt="Facebook" loading="lazy" onerror="this.src='assets/facebook-icon.webp'"></span>
        <span class="link-text"><span class="link-label">Facebook</span><span class="link-handle">Primera Piedra</span></span>
      </a>
      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/company/primera-piedra-podcast" target="_blank" rel="noopener noreferrer" class="social-link">
        <span class="social-icon"><img src="assets/linkedin-icon.png" alt="LinkedIn" loading="lazy" onerror="this.src='assets/linkedin-icon.webp'"></span>
        <span class="link-text"><span class="link-label">LinkedIn</span><span class="link-handle">Red profesional</span></span>
      </a>
      <!-- Contacto (Email) - OCUPA AMBAS COLUMNAS -->
      <a href="mailto:primerapiedraec@gmail.com" class="social-link contact-link">
        <span class="social-icon"><img src="assets/email-icon.png" alt="Email" loading="lazy" onerror="this.src='assets/email-icon.webp'"></span>
        <span class="link-text"><span class="link-label">Contáctanos</span><span class="link-handle">primerapiedraec@gmail.com</span></span>
      </a>
    </div>

    <div class="footer">
      <span>© 2026 Primera Piedra</span>
      <span class="footer-dot"></span>
      <span>Karina & Rebeca</span>
    </div>
  </main>

  <script>
    (function() {
      // Feedback táctil para móviles
      const links = document.querySelectorAll('.social-link');
      links.forEach(link => {
        link.addEventListener('touchstart', function(e) {
          this.style.transform = 'scale(0.97)';
          this.style.transition = 'transform 0.08s ease';
        }, {passive: true});
        link.addEventListener('touchend', function(e) {
          this.style.transform = '';
          this.style.transition = 'transform 0.25s cubic-bezier(0.25, 0.1, 0.25, 1)';
        });
        link.addEventListener('touchcancel', function(e) {
          this.style.transform = '';
        });
      });
      // Animación suave de entrada
      const container = document.querySelector('.glass-container');
      if (container) {
        container.style.opacity = '0';
        container.style.transform = 'translateY(20px)';
        container.style.transition = 'opacity 0.6s ease, transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1.1)';
        window.addEventListener('load', () => {
          setTimeout(() => {
            container.style.opacity = '1';
            container.style.transform = 'translateY(0)';
          }, 80);
        });
      }
    })();
  </script>
</body>
</html>
